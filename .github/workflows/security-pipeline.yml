name: Security Pipeline

on:
  # Manual run supports scanning any repo/branch without pushing code changes.
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repository URL to scan (example: https://github.com/org/repo.git)"
        required: false
        type: string
      source_branch:
        description: "Branch name to scan from the provided repo URL"
        required: false
        type: string
      issue_target_repo:
        description: "Optional owner/repo where GitHub issues should be created"
        required: false
        type: string
      threshold:
        description: "Gate threshold"
        required: false
        default: high
        type: choice
        options:
          - high
          - critical
  pull_request:
    # Auto-run when the shared scanning pipeline changes.
    paths:
      - '.github/workflows/security-pipeline.yml'
      - 'sbom/**'
      - 'cbom/**'
      - 'runner/**'
      - 'scripts/**'
      - 'common/**'
  push:
    branches: [ main ]
    # Keep main branch continuously validated for shared scanner changes.
    paths:
      - '.github/workflows/security-pipeline.yml'
      - 'sbom/**'
      - 'cbom/**'
      - 'runner/**'
      - 'scripts/**'
      - 'common/**'

permissions:
  contents: read
  issues: write

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      # Root folder where the shared runner writes one timestamped run bundle.
      REPORT_ROOT: reports/${{ github.run_id }}-${{ github.run_attempt }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Trivy
        # Trivy is installed directly in job runtime for local parity.
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install runner and scanner dependencies
        # The shared runner shells into both sbom and cbom packages, so all
        # package-level dependencies must exist in CI.
        shell: bash
        run: |
          cd runner
          npm ci
          cd ../sbom
          npm ci
          cd ../cbom
          npm ci

      - name: Resolve scan source
        id: source
        shell: bash
        run: |
          # Priority order:
          # 1) workflow_dispatch inputs (source_repo/source_branch/threshold)
          # 2) local workspace defaults for push/PR events
          # Using local workspace avoids PR synthetic refs like "<id>/merge".
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.source_repo }}" ]]; then
            echo "repo=${{ github.event.inputs.source_repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=." >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.source_branch }}" ]]; then
            echo "branch=${{ github.event.inputs.source_branch }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.threshold }}" ]]; then
            echo "threshold=${{ github.event.inputs.threshold }}" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=high" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve issue target repository
        id: issue_repo
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.issue_target_repo }}" ]]; then
            echo "repo=${{ github.event.inputs.issue_target_repo }}" >> "$GITHUB_OUTPUT"
          else
            source_repo="${{ steps.source.outputs.repo }}"
            if [[ "$source_repo" == "." ]]; then
              echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            elif [[ "$source_repo" =~ github\.com[:/]+([^/]+)/([^/]+)(\.git)?$ ]]; then
              repo_name="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
              repo_name="${repo_name%.git}"
              echo "repo=$repo_name" >> "$GITHUB_OUTPUT"
            else
              echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Show resolved execution inputs
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Source repo: ${{ steps.source.outputs.repo }}"
          echo "Source branch: ${{ steps.source.outputs.branch }}"
          echo "Threshold: ${{ steps.source.outputs.threshold }}"
          echo "Issue target repo: ${{ steps.issue_repo.outputs.repo }}"

      - name: Run shared CycloGuard runner
        # Runs the latest combined solution: repo acquisition, CBOM, SBOM,
        # issue creation, combined Slack message, dashboard, and report bundle.
        shell: bash
        env:
          API_GITHUB_TOKEN: ${{ secrets.API_GITHUB_TOKEN }}
          GITHUB_TARGET_REPO: ${{ steps.issue_repo.outputs.repo }}
        run: |
          mkdir -p "$REPORT_ROOT"
          cd runner
          npx ts-node src/index.ts \
            --source "${{ steps.source.outputs.repo }}" \
            --branch "${{ steps.source.outputs.branch }}" \
            --scan all \
            --threshold "${{ steps.source.outputs.threshold }}" \
            --output "../$REPORT_ROOT"

      - name: Resolve generated scan directory
        id: scan_dir
        if: always()
        shell: bash
        run: |
          scan_dir=$(find "$REPORT_ROOT" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          echo "dir=$scan_dir" >> "$GITHUB_OUTPUT"

      - name: Enforce SBOM security gate
        if: always() && steps.scan_dir.outputs.dir != ''
        shell: bash
        run: |
          gate_file="${{ steps.scan_dir.outputs.dir }}/sbom/gate-result.json"
          python - <<'PY' "$gate_file"
          import json
          import sys
          gate_file = sys.argv[1]
          with open(gate_file, "r", encoding="utf-8") as handle:
              gate = json.load(handle)
          gate_failed = bool(gate.get("gate_failed"))
          threshold = gate.get("threshold", "high")
          print(f"Gate threshold: {threshold}")
          print(f"Gate failed: {gate_failed}")
          if gate_failed:
              sys.exit(1)
          PY

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Security Pipeline Summary"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Scanned source: \`${{ steps.source.outputs.repo }}\`"
            echo "- Scanned branch: \`${{ steps.source.outputs.branch }}\`"
            echo "- Threshold: \`${{ steps.source.outputs.threshold }}\`"
            echo "- Issue target repo: \`${{ steps.issue_repo.outputs.repo }}\`"
            echo "- Report root: \`${{ env.REPORT_ROOT }}\`"
            echo "- Scan output folder: \`${{ steps.scan_dir.outputs.dir }}\`"
            echo "- Dashboard: \`${{ steps.scan_dir.outputs.dir }}/dashboard.html\`"
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List generated reports
        if: always()
        # Useful debugging snapshot before artifact upload.
        shell: bash
        run: |
          echo "Report root: $REPORT_ROOT"
          if [[ -n "${{ steps.scan_dir.outputs.dir }}" ]]; then
            find "${{ steps.scan_dir.outputs.dir }}" -maxdepth 5 -type f | sort
          else
            find "$REPORT_ROOT" -maxdepth 5 -type f | sort
          fi

      - name: Upload full report bundle
        if: always()
        # Canonical artifact containing the full combined runner output.
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir || env.REPORT_ROOT }}
          if-no-files-found: warn

      - name: Upload dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir }}/dashboard.html
          if-no-files-found: warn

      - name: Upload SBOM bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir }}/sbom
          if-no-files-found: warn

      - name: Upload CBOM bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbom-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir }}/cbom
          if-no-files-found: warn
