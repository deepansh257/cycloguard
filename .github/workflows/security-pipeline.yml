name: Security Pipeline

on:
  # Manual run supports scanning any repo/branch without pushing code changes.
  workflow_dispatch:
    inputs:
      source_repo:
        description: "GitHub repository URL to scan (example: https://github.com/org/repo.git)"
        required: false
        type: string
      source_branch:
        description: "Branch name to scan from the provided repo URL"
        required: false
        type: string
      issue_target_repo:
        description: "Optional owner/repo where GitHub issues should be created"
        required: false
        type: string
      threshold:
        description: "Gate threshold"
        required: false
        default: high
        type: choice
        options:
          - high
          - critical
      enable_remediation:
        description: "Enable AI-assisted remediation branch and draft PR creation"
        required: false
        default: false
        type: boolean
      create_remediation_pr:
        description: "Create a remediation draft PR after fixes are applied"
        required: false
        default: true
        type: boolean
  pull_request:
    # Auto-run when security pipeline or sbom implementation changes.
    paths:
      - '.github/workflows/security-pipeline.yml'
      - 'sbom/**'
  push:
    branches: [ main ]
    # Keep main branch continuously validated for scanner changes.
    paths:
      - '.github/workflows/security-pipeline.yml'
      - 'sbom/**'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      # Unique per-run output folder used for all generated artifacts.
      REPORT_DIR: sbom/reports/${{ github.run_id }}-${{ github.run_attempt }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Trivy
        # Trivy is installed directly in job runtime for local parity.
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Install SBOM CLI deps
        # Installs TypeScript CLI dependencies from sbom/package.json.
        shell: bash
        run: |
          cd sbom
          npm install

      - name: Resolve scan source
        id: source
        shell: bash
        run: |
          # Priority order:
          # 1) workflow_dispatch inputs (source_repo/source_branch/threshold)
          # 2) local workspace defaults for push/PR events
          # Using local workspace avoids PR synthetic refs like "<id>/merge".
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.source_repo }}" ]]; then
            echo "repo=${{ github.event.inputs.source_repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "repo=." >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.source_branch }}" ]]; then
            echo "branch=${{ github.event.inputs.source_branch }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.threshold }}" ]]; then
            echo "threshold=${{ github.event.inputs.threshold }}" >> "$GITHUB_OUTPUT"
          else
            echo "threshold=high" >> "$GITHUB_OUTPUT"
          fi

      - name: Show resolved execution inputs
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Source repo: ${{ steps.source.outputs.repo }}"
          echo "Source branch: ${{ steps.source.outputs.branch }}"
          echo "Threshold: ${{ steps.source.outputs.threshold }}"
          echo "Issue target input: ${{ github.event.inputs.issue_target_repo }}"
          echo "Enable remediation: ${{ github.event.inputs.enable_remediation }}"
          echo "Create remediation PR: ${{ github.event.inputs.create_remediation_pr }}"

      - name: Resolve issue target repository
        id: issue_repo
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.issue_target_repo }}" ]]; then
            echo "repo=${{ github.event.inputs.issue_target_repo }}" >> "$GITHUB_OUTPUT"
          else
            source_repo="${{ steps.source.outputs.repo }}"
            if [[ "$source_repo" == "." ]]; then
              echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            elif [[ "$source_repo" =~ github\.com[:/]+([^/]+)/([^/]+)(\.git)?$ ]]; then
              repo_name="${BASH_REMATCH[1]}/${BASH_REMATCH[2]}"
              repo_name="${repo_name%.git}"
              echo "repo=$repo_name" >> "$GITHUB_OUTPUT"
            else
              echo "repo=${{ github.repository }}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Show resolved issue target
        shell: bash
        run: |
          echo "Issue target repo: ${{ steps.issue_repo.outputs.repo }}"

      - name: Run scanner CLI
        # Main engine: clone-or-pull repo, auto-detect stack, generate SBOM, run Trivy, emit reports.
        shell: bash
        run: |
          mkdir -p "$REPORT_DIR"
          cd sbom
          npx ts-node src/index.ts \
            --source "${{ steps.source.outputs.repo }}" \
            --branch "${{ steps.source.outputs.branch }}" \
            --threshold "${{ steps.source.outputs.threshold }}" \
            --output "../$REPORT_DIR" \
            --fs-scan true \
            --secret-scan false \
            --misconfig-scan false \
            --create-issues true \
            --notify-slack true \
            --enable-remediation "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_remediation || 'false' }}" \
            --create-pr "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_remediation_pr || 'false' }}" \
            --github-repo "${{ steps.issue_repo.outputs.repo }}" \
            --github-token "${{ secrets.API_GITHUB_TOKEN }}" \
            --slack-webhook "$SLACK_WEBHOOK_URL" \
            --git-user-name "CycloGuard Bot" \
            --git-user-email "cycloguard-bot@users.noreply.github.com"

      - name: Resolve generated scan directory
        id: scan_dir
        shell: bash
        run: |
          scan_dir=$(find "$REPORT_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          echo "dir=$scan_dir" >> "$GITHUB_OUTPUT"

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Security Pipeline Summary"
            echo ""
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Scanned source: \`${{ steps.source.outputs.repo }}\`"
            echo "- Scanned branch: \`${{ steps.source.outputs.branch }}\`"
            echo "- Threshold: \`${{ steps.source.outputs.threshold }}\`"
            echo "- Issue target repo: \`${{ steps.issue_repo.outputs.repo }}\`"
            echo "- Remediation enabled: \`${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_remediation || 'false' }}\`"
            echo "- Report root: \`${{ env.REPORT_DIR }}\`"
            echo "- Scan output folder: \`${{ steps.scan_dir.outputs.dir }}\`"
            echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: List generated reports
        if: always()
        # Useful debugging snapshot before artifact upload.
        shell: bash
        run: |
          echo "Report directory: $REPORT_DIR"
          find "$REPORT_DIR" -maxdepth 4 -type f | sort

      - name: Upload full report bundle
        if: always()
        # Canonical artifact containing all outputs from this run.
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.REPORT_DIR }}
          if-no-files-found: warn

      - name: Upload Trivy Node report
        if: always()
        # Convenience artifact: language-specific Trivy summary.
        uses: actions/upload-artifact@v4
        with:
          name: trivy-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir }}/trivy-node.json
          if-no-files-found: warn

      - name: Upload Trivy Java report
        if: always()
        # Convenience artifact: language-specific Trivy summary.
        uses: actions/upload-artifact@v4
        with:
          name: trivy-java-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir }}/trivy-java.json
          if-no-files-found: warn

      - name: Upload Trivy Python report
        if: always()
        # Convenience artifact: language-specific Trivy summary.
        uses: actions/upload-artifact@v4
        with:
          name: trivy-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir }}/trivy-python.json
          if-no-files-found: warn

      - name: Upload Trivy CSharp report
        if: always()
        # Convenience artifact: language-specific Trivy summary.
        uses: actions/upload-artifact@v4
        with:
          name: trivy-csharp-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan_dir.outputs.dir }}/trivy-csharp.json
          if-no-files-found: warn
